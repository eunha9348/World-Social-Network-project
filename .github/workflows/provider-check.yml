# Replaces the two verification curl commands in docs/CLOUDFLARE_GEMINI_SETUP.md for operators
# without a shell. Run from the Actions tab; it spends one embedding call and nothing else.
name: Provider check

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'gemini or openai'
        type: choice
        options: [gemini, openai]
        default: gemini
      embedding_model:
        description: 'Blank uses the provider default'
        type: string
        default: ''
      dimensions:
        description: 'Must match the Qdrant collection'
        type: string
        default: '1536'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: List models and verify embedding dimension
        env:
          PROVIDER: ${{ inputs.provider }}
          EMBEDDING_MODEL: ${{ inputs.embedding_model }}
          DIMENSIONS: ${{ inputs.dimensions }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          P = {'gemini': ('https://generativelanguage.googleapis.com/v1beta/openai',
                          'GOOGLE_API_KEY', 'gemini-embedding-001'),
               'openai': ('https://api.openai.com/v1',
                          'OPENAI_API_KEY', 'text-embedding-3-small')}
          name = os.environ['PROVIDER']
          base, key_env, default_model = P[name]
          key = os.environ.get(key_env) or ''
          if not key:
              sys.exit(f'::error::{key_env} is not set. Add it under Settings > Secrets and variables > Actions.')
          model = os.environ.get('EMBEDDING_MODEL') or default_model
          dims = int(os.environ.get('DIMENSIONS') or 1536)

          def call(path, body=None):
              req = urllib.request.Request(
                  f'{base}/{path}',
                  data=None if body is None else json.dumps(body).encode(),
                  headers={'Authorization': f'Bearer {key}', 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  sys.exit(f'::error::HTTP {e.code} from {path}; response body withheld so no key material is logged')

          ids = sorted(m.get('id', '') for m in call('models').get('data', []))
          print(f'{len(ids)} models reachable with this key:')
          for i in ids:
              print(f'  {i}')
          if model not in ids:
              print(f'::warning::{model} is not in the list above. '
                    f'The id may still work if the listing is partial, but check it before indexing.')

          vector = call('embeddings', {'model': model, 'input': '테스트 test', 'dimensions': dims}
                        )['data'][0]['embedding']
          print(f'\n{model} returned {len(vector)} dimensions (requested {dims})')
          if len(vector) != dims:
              sys.exit(f'::error::Provider ignored the `dimensions` parameter. Do NOT index yet: '
                       f'either set EMBEDDING_DIMENSIONS={len(vector)} and build the Qdrant collection '
                       f'at that size, or switch to the native endpoint. See docs/CLOUDFLARE_GEMINI_SETUP.md.')
          print('\nOK. Index and query will agree at this dimension.')
          PY
