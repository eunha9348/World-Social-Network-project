# Manual corpus ingestion for operators without a shell. Both pipeline scripts are standard
# library only, so the runner needs no dependency install. Every run spends model credits unless
# dry_run stays on, so this is workflow_dispatch only and never fires on push.
name: Ingest corpus

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'hn-search is topical. hn-firehose returns whatever was posted, on no subject.'
        type: choice
        options: [hn-search, mastodon, hn-firehose]
        default: hn-search
      query:
        description: 'Subject, for hn-search. The corpus is only as focused as this.'
        type: string
        default: 'artificial intelligence'
      instances:
        description: 'Mastodon hosts, comma-separated. Pick by language community.'
        type: string
        default: 'mastodon.social'
      languages:
        description: 'Keep only these languages, for mastodon. Blank keeps all.'
        type: string
        default: ''
      collect_limit:
        description: 'Hacker News items to collect this run'
        type: string
        default: '50'
      max_documents:
        description: 'Documents to index this run (each one costs an annotation and an embedding call)'
        type: string
        default: '20'
      dry_run:
        description: 'Validate input structure only. No model calls, no writes.'
        type: boolean
        default: true
      offline_upload:
        description: 'Write the rows to an artifact to upload at /admin/ingest, instead of posting to the site. Required on hosts that refuse server-to-server calls, such as ChatGPT Sites.'
        type: boolean
        default: true

# The checkpoint files are shared state; overlapping runs would double-spend and skip items.
concurrency:
  group: ingest-corpus
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # data/ is gitignored. The cache carries the HN cursor and the annotation checkpoint so a
      # rerun resumes instead of re-paying for work already done. Cache entries can be evicted;
      # D1 and Qdrant both key on a deterministic id, so a cold run re-spends but never duplicates.
      - name: Restore ingestion checkpoints
        uses: actions/cache@v5
        with:
          path: |
            data/hn.cursor
            data/hn-search.cursor
            data/mastodon.cursor
            data/index.sqlite
          key: vmax-ingest-${{ github.run_id }}
          restore-keys: vmax-ingest-

      # A dry run must not advance the real cursor: the items it collects are never indexed, so
      # sharing the cursor would walk them past the real run and lose them.
      - name: Collect
        env:
          SOURCE: ${{ inputs.source }}
          QUERY: ${{ inputs.query }}
          INSTANCES: ${{ inputs.instances }}
          LANGUAGES: ${{ inputs.languages }}
          LIMIT: ${{ inputs.collect_limit }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then SUFFIX=".dryrun"; else SUFFIX=""; fi
          case "$SOURCE" in
            hn-search)
              python pipeline/collect_hn.py --query "$QUERY" --limit "$LIMIT" \
                --output data/corpus.jsonl --cursor "data/hn-search$SUFFIX.cursor" ;;
            hn-firehose)
              python pipeline/collect_hn.py --limit "$LIMIT" \
                --output data/corpus.jsonl --cursor "data/hn$SUFFIX.cursor" ;;
            mastodon)
              python pipeline/collect_mastodon.py --instances "$INSTANCES" --languages "$LANGUAGES" \
                --limit "$LIMIT" --output data/corpus.jsonl --cursor "data/mastodon$SUFFIX.cursor" ;;
            *) echo "::error::unknown source $SOURCE"; exit 1 ;;
          esac
          echo "collected $(wc -l < data/corpus.jsonl) lines total in data/corpus.jsonl"

      - name: Validate structure
        run: python pipeline/index_corpus.py data/corpus.jsonl --dry-run --max-documents "${{ inputs.max_documents }}"

      # These values are easy to confuse. Catch a swap here rather than after paying for
      # annotation and embeddings. Offline delivery never contacts the site, so it needs neither
      # SITE_URL nor INGEST_TOKEN and the endpoint probe is skipped.
      - name: Preflight secrets
        if: ${{ inputs.dry_run == false }}
        env:
          OFFLINE: ${{ inputs.offline_upload }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          python - <<'PY'
          import os, sys
          g = lambda k: (os.environ.get(k) or '').strip()
          offline = os.environ.get('OFFLINE') == 'true'
          needed = ['GOOGLE_API_KEY', 'QDRANT_URL', 'QDRANT_API_KEY']
          if not offline:
              needed += ['SITE_URL', 'INGEST_TOKEN']
          problems = [f'{k} is empty. Add it under Settings > Secrets and variables > Actions.'
                      for k in needed if not g(k)]
          site, qurl = g('SITE_URL'), g('QDRANT_URL')
          if qurl and not qurl.startswith('https://'):
              problems.append(f'QDRANT_URL must start with https:// (got {qurl[:30]!r})')
          if not offline:
              if site and not site.startswith('https://'):
                  problems.append(f'SITE_URL must start with https:// (got {site[:30]!r})')
              if site and 'qdrant' in site.lower():
                  problems.append('SITE_URL looks like the Qdrant cluster address. It is the address '
                                  'of your deployed VMAX site, where /api/ingest lives.')
              if g('INGEST_TOKEN') and g('INGEST_TOKEN') == g('QDRANT_API_KEY'):
                  problems.append('INGEST_TOKEN equals QDRANT_API_KEY. INGEST_TOKEN is a token you '
                                  'generate yourself and set identically on the deployed site.')
          if problems:
              for p in problems:
                  print(f'::error::{p}')
              sys.exit(1)
          print('offline delivery: rows go to an artifact' if offline else 'secrets look consistent')

          if offline:
              sys.exit(0)

          # The app answers 401 for a bad INGEST_TOKEN and 400 for an accepted one with an empty
          # body. Its only 403 is sameOrigin(), which needs an Origin header we do not send, so a
          # 403 on every path means something in front of the site refused the request.
          import json, urllib.request, urllib.error

          def probe(path, token=None, method='GET'):
              headers = {'Content-Type': 'application/json'}
              if token is not None:
                  headers['Authorization'] = 'Bearer ' + token
              data = json.dumps({'posts': []}).encode() if method == 'POST' else None
              req = urllib.request.Request(site.rstrip('/') + path, data=data,
                                           headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status
              except urllib.error.HTTPError as e:
                  return e.code
              except Exception as e:
                  sys.exit(f'::error::could not reach {site}{path}: {type(e).__name__}.')

          public = probe('/api/status')
          good = probe('/api/ingest', g('INGEST_TOKEN'), 'POST')
          bogus = probe('/api/ingest', 'definitely-not-the-token', 'POST')
          print(f'GET  /api/status  (no auth)     -> {public}')
          print(f'POST /api/ingest  (real token)  -> {good}')
          print(f'POST /api/ingest  (wrong token) -> {bogus}')
          if good == 400:
              print('\ntoken accepted; only the empty body was rejected. Ready to index.')
          elif good == bogus and good in (401, 403) and public in (401, 403):
              sys.exit(f'\n::error::Every path returns {public}, including one needing no auth, so '
                       f'the host is refusing before the app sees the request. If the host cannot be '
                       f'made reachable, rerun with offline_upload enabled.')
          elif good in (401, 403):
              sys.exit('\n::error::the app rejected this INGEST_TOKEN. Set the SAME value in the '
                       'deployed site\'s environment variables and redeploy.')
          elif good == 404:
              sys.exit(f'\n::error::no /api/ingest at {site}. SITE_URL is probably not the VMAX site.')
          else:
              print(f'::warning::unexpected status {good}; continuing, but watch the index step.')
          PY

      - name: Index
        if: ${{ inputs.dry_run == false }}
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
          EMBEDDING_DIMENSIONS: ${{ vars.EMBEDDING_DIMENSIONS || '1536' }}
          REASONING_EFFORT: ${{ vars.REASONING_EFFORT }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_COLLECTION: ${{ vars.QDRANT_COLLECTION || 'polylogue' }}
          SITE_URL: ${{ secrets.SITE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          if [ "${{ inputs.offline_upload }}" = "true" ]; then
            python pipeline/index_corpus.py data/corpus.jsonl \
              --max-documents "${{ inputs.max_documents }}" \
              --offline-output data/upload-to-admin-ingest.jsonl
          else
            python pipeline/index_corpus.py data/corpus.jsonl \
              --max-documents "${{ inputs.max_documents }}"
          fi

      # Private to repository collaborators. With offline delivery this artifact is not a review
      # copy but the payload itself: the run is unfinished until it is uploaded at /admin/ingest.
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: corpus-${{ github.run_id }}
          path: |
            data/corpus.jsonl
            data/upload-to-admin-ingest.jsonl
          retention-days: 7
          if-no-files-found: warn
