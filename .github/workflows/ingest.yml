# Manual corpus ingestion for operators without a shell. Both pipeline scripts are standard
# library only, so the runner needs no dependency install. Every run spends model credits unless
# dry_run stays on, so this is workflow_dispatch only and never fires on push.
name: Ingest corpus

on:
  workflow_dispatch:
    inputs:
      collect_limit:
        description: 'Hacker News items to collect this run'
        type: string
        default: '50'
      max_documents:
        description: 'Documents to index this run (each one costs an annotation and an embedding call)'
        type: string
        default: '20'
      dry_run:
        description: 'Validate input structure only. No model calls, no writes.'
        type: boolean
        default: true

# The checkpoint files are shared state; overlapping runs would double-spend and skip items.
concurrency:
  group: ingest-corpus
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # data/ is gitignored. The cache carries the HN cursor and the annotation checkpoint so a
      # rerun resumes instead of re-paying for work already done. Cache entries can be evicted;
      # D1 and Qdrant both key on a deterministic id, so a cold run re-spends but never duplicates.
      - name: Restore ingestion checkpoints
        uses: actions/cache@v5
        with:
          path: |
            data/hn.cursor
            data/index.sqlite
          key: vmax-ingest-${{ github.run_id }}
          restore-keys: vmax-ingest-

      # A dry run must not advance the real cursor: the items it collects are never indexed, so
      # sharing the cursor would walk them past the real run and lose them.
      - name: Collect from the official Hacker News API
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python pipeline/collect_hn.py --limit "${{ inputs.collect_limit }}"               --output data/hn.jsonl --cursor data/hn.dryrun.cursor
          else
            python pipeline/collect_hn.py --limit "${{ inputs.collect_limit }}"               --output data/hn.jsonl --cursor data/hn.cursor
          fi

      - name: Validate structure
        run: python pipeline/index_corpus.py data/hn.jsonl --dry-run --max-documents "${{ inputs.max_documents }}"

      # These four values are easy to confuse. Catch a swap here rather than after paying for
      # annotation and embeddings, or after a run half-writes Qdrant and 403s on the site.
      - name: Preflight secrets
        if: ${{ inputs.dry_run == false }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          python - <<'PY'
          import os, sys
          g = lambda k: (os.environ.get(k) or '').strip()
          problems = []
          for k in ('GOOGLE_API_KEY', 'QDRANT_URL', 'QDRANT_API_KEY', 'SITE_URL', 'INGEST_TOKEN'):
              if not g(k):
                  problems.append(f'{k} is empty. Add it under Settings > Secrets and variables > Actions.')
          site, qurl = g('SITE_URL'), g('QDRANT_URL')
          if site and not site.startswith('https://'):
              problems.append(f'SITE_URL must start with https:// (got {site[:30]!r})')
          if site and 'qdrant' in site.lower():
              problems.append('SITE_URL looks like the Qdrant cluster address. It is the address of '
                              'your deployed VMAX site, where /api/ingest lives. The Qdrant address '
                              'belongs in QDRANT_URL.')
          if qurl and not qurl.startswith('https://'):
              problems.append(f'QDRANT_URL must start with https:// (got {qurl[:30]!r})')
          if site and qurl and site.rstrip('/') == qurl.rstrip('/'):
              problems.append('SITE_URL and QDRANT_URL are the same value; they are different services.')
          if g('INGEST_TOKEN') and g('INGEST_TOKEN') == g('QDRANT_API_KEY'):
              problems.append('INGEST_TOKEN equals QDRANT_API_KEY. INGEST_TOKEN is a token you '
                              'generate yourself and set identically on the deployed site; it is not '
                              'a Qdrant credential.')
          if problems:
              for p in problems:
                  print(f'::error::{p}')
              sys.exit(1)
          print('secrets look consistent')
          PY

      - name: Index
        if: ${{ inputs.dry_run == false }}
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
          EMBEDDING_DIMENSIONS: ${{ vars.EMBEDDING_DIMENSIONS || '1536' }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_COLLECTION: ${{ vars.QDRANT_COLLECTION || 'polylogue' }}
          SITE_URL: ${{ secrets.SITE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: python pipeline/index_corpus.py data/hn.jsonl --max-documents "${{ inputs.max_documents }}"

      # Private to repository collaborators. Review the labels the model assigned before scaling up.
      - name: Upload this run's JSONL for review
        uses: actions/upload-artifact@v6
        with:
          name: corpus-${{ github.run_id }}
          path: data/hn.jsonl
          retention-days: 7
          if-no-files-found: warn
